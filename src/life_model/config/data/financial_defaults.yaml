    survival_probability_cutoff: 0.001  # stop integrating once survival falls below this
  general:
    default_premium_increase_rate: 3.0  # percentage
    default_max_claims_per_year: 3
  pension:
    # The Simplified Method's number of anticipated monthly payments (an employee's after-tax basis is
    # recovered tax-free over them): [maximum age, payments] for one life, [maximum combined age, payments]
    # with a survivor annuitant. vintage: statutory, source: IRS Pub. 575 (2025) Simplified Method
    # Worksheet Tables 1 and 2 (irs.gov/publications/p575, fetched 2026-10-18), IRC §72(d)(1)(B)
    simplified_method_single: [[55, 360], [60, 310], [65, 260], [70, 210], [200, 160]]
    simplified_method_joint: [[110, 410], [120, 360], [130, 310], [140, 260], [400, 210]]
    # Interest rate for a lump sum's present value and the actuarial survivor reduction when the plan does
    # not state them: a modeling assumption (not the IRC §417(e) segment rates), so no vintage.
    lump_sum_interest_rate: 5.0

debt:
  credit_card:
    default_interest_rate: 18.0  # percentage
    default_minimum_payment_percent: 2.0  # percentage
    default_minimum_payment_floor: 25.0  # dollars, typical card minimum-payment floor
  student_loan:
    # vintage: statutory, source: IRC §221(b)(1) above-the-line interest deduction cap (MAGI phase-out: tax_years)
    interest_deduction_limit: 2500  # dollars per year
    # vintage: 2026, source: One Big Beautiful Bill Act Repayment Assistance Plan; studentaid.gov.
    # Income-driven plan for federal loans made from July 2026 (opt in per loan).
    repayment_assistance_plan:
      income_step: 10000  # 1% of AGI per full $10k step above the first ...
      rate_step_percent: 1.0
      max_rate_percent: 10.0  # ... capped at 10% of AGI above $100k
      minimum_annual: 120.0  # AGI at or below $10k
      minimum_monthly: 10.0
      dependent_credit_monthly: 50.0
      principal_match_monthly: 50.0
      forgiveness_years: 30
      forgiveness_taxable: true  # ARPA §9675 exclusion ended with 2025 discharges
  # Interest on unpaid bills carried into the next year (Person.debt). Modeling assumption, not a
  # published figure: null charges the credit-card rate above.
  unpaid_balance_interest_rate: null

housing:
  # PMI charged (a twelfth a month) while loan-to-value exceeds the threshold, then dropped.
  pmi_rate: 0.5  # percent of loan balance per year
  # Homeowners Protection Act: cancellation at the borrower's request once the balance reaches 80% of
  # the original value (by actual payments: the engine assumes the request), automatic termination
  # when the original schedule reaches 78%, final termination at the midpoint of the term.
  # vintage: statutory, source: 12 U.S.C. 4901(2), (12), (18) and 4902(a)-(c) (law.cornell.edu, fetched
  # 2026-10-18)
  pmi_ltv_threshold: 80.0  # percent LTV (cancellation date)
  pmi_termination_ltv: 78.0  # percent LTV (termination date)
  closing_cost_percent: 2.0  # percent of purchase price paid at purchase
  selling_cost_percent: 6.0  # percent of sale price paid at sale (agent commission, etc.)
  # vintage: statutory, source: IRC §121 primary-residence capital-gains exclusion (unindexed)
  section_121_exclusion:
    single: 250000
    married_filing_jointly: 500000

# Children and dependents: age-banded cost of raising a child and the child-related
# tax credits. Costs are nominal (start-year dollars) and grown by cumulative inflation
# in Child.pre_step so a child born later costs later-year dollars.
dependents:
  # Age-banded annual cost of a child. Representative national estimates.
  # vintage: 2024, source: Child Care Aware of America (childcare ~0-5); USDA/Brookings
  #   child-rearing cost estimates (school age 6-17); College Board Trends in College
  #   Pricing (college) -- placeholders, TODO(verify) against a primary cost survey.
  childcare_annual_cost: 12000    # ages 0 through college_start_age-13 (roughly 0-5)
  school_age_annual_cost: 8000    # school-age band (roughly 6-17)
  college_annual_cost: 28000      # per college year; drawn from a 529 first when available
  college_start_age: 18
  college_years: 4
  adult_age: 18                   # costs stop at this age (except the college band)
  # Child Tax Credit (IRC §24 as amended by the One Big Beautiful Bill Act).
  # vintage: 2026, source: IRC §24(h)(2)/(5) (OBBBA), Rev. Proc. 2025-32.
  ctc_per_child: 2200
  ctc_refundable_max: 1700
  # Oldest qualifying age, inclusive: a qualifying child "has not attained age 17" by year end.
  # vintage: statutory, source: IRC §24(c)(1) (a 17-year-old does not qualify)
  ctc_qualifying_age_max: 16
  # Phase-out thresholds are statutory and not inflation-indexed.
  # vintage: statutory, source: IRC §24(h)(3).
  ctc_phaseout_start:
    single: 200000
    married_filing_jointly: 400000
    head_of_household: 200000
  ctc_phaseout_rate: 5.0          # percent of modified AGI over threshold ($50 per $1,000)
  # vintage: statutory, source: IRC §24(h)(4) credit for other dependents (permanent under OBBBA §70104)
  odc_per_dependent: 500
  # vintage: statutory, source: IRC §24(d)(1)(B)(i), §24(h)(6): the additional child tax credit is 15% of
  # earned income over $2,500 (Schedule 8812 Part II-A), up to the refundable maximum per child
  actc_earned_income_threshold: 2500
  actc_rate: 15.0

# Stock compensation defaults. These are modeling conventions rather than published figures, so
# they carry no vintage stamp. A stock plan that names no schedule uses default_schedule; the
# "even" preset spreads a grant evenly over default_vesting_years.
equity_comp:
  default_schedule: four_year   # four_year | three_year | front_loaded | back_loaded | even
  default_vesting_years: 4

# Payroll timing (jobs pay monthly; a yearly bonus is paid in bonus_month). A modeling convention, not a
# published figure.
payroll:
  bonus_month: 3  # month (1-12) a yearly bonus is paid in

# Estate settlement. inherited_pretax_mode controls how a non-spouse beneficiary receives an
# inherited pre-tax retirement balance: "ten_year" applies the SECURE Act 10-year rule (the
# balance keeps growing and pays out an even slice each year over ten years), while "lump_sum"
# distributes and taxes the whole balance in the death year (the lump-sum simplification).
# vintage: 2020, source: SECURE Act §401 (10-year rule for non-eligible designated beneficiaries)
estate:
  inherited_pretax_mode: ten_year  # ten_year | lump_sum

# Economy-wide rates driving account returns, wage growth, and inflation. A single
# EconomyModel per simulation reads this section and answers per-year rate queries.
# The defaults are long-run assumptions; in `mode: fixed` every account without its own rate grows
# at them every year. See docs/configuration.md for path/stochastic modes.
economy:
  mode: fixed  # fixed | path | stochastic
  inflation: 3.0          # percent CPI (drives spending/rent increases when opted in)
  wage_growth: 3.0        # percent nominal wage growth (salary increases when opted in)
  equity_return: 7.0      # percent (brokerage / IRA / 529 default return)
  bond_return: 3.0        # percent
  cash_yield: 0.0         # percent (bank account default interest)
  home_appreciation: 4.0  # percent home value appreciation
  paths: {}               # PATH mode: {rate_name: {year: percent, ...}, ...}
  stochastic:             # STOCHASTIC mode distribution parameters (percent)
    equity_mean: 7.0
    equity_vol: 15.0
    bond_mean: 3.0
    bond_vol: 5.0
    inflation_mean: 3.0
    inflation_vol: 1.5
    cash_yield_mean: 0.0
    cash_yield_vol: 0.5
    home_appreciation_mean: 4.0
    home_appreciation_vol: 6.0
    wage_growth_mean: 3.0
    wage_growth_vol: 1.0
    equity_bond_correlation: 0.1
    equity_inflation_correlation: -0.1
    bond_inflation_correlation: -0.2

# Healthcare, Medicare & long-term care. Opt-in agents (MedicalCosts, Medicare,
# LongTermCare) read this section; a simulation with none constructed is unaffected. Dollar
# values are vintage-stamped from CMS/SSA/Genworth/NFDA primary sources. Refresh annually via
# the refresh-financial-data skill (Medicare Part B/D premiums, IRMAA tiers, LTC costs, funeral).
healthcare:
  # Age-banded out-of-pocket medical-cost curve (real start-year dollars, per person per year).
  # max_age is the inclusive upper bound of the band. Scaled each year by cumulative inflation
  # plus medical_inflation_premium. vintage: 2024, source: CMS NHE / MEPS OOP by age -- TODO(verify)
  medical_cost_bands:
    - {max_age: 39,  annual_cost: 1500}
    - {max_age: 64,  annual_cost: 3000}
    - {max_age: 74,  annual_cost: 6000}
    - {max_age: 84,  annual_cost: 9000}
    - {max_age: 200, annual_cost: 12000}
  # Percentage points medical inflation runs above CPI.
  # vintage: 2024, source: CMS National Health Expenditure projections -- TODO(verify)
  medical_inflation_premium: 2.0
  medicare:
    eligibility_age: 65
    # Part A is premium-free with sufficient work history (documented simplification).
    # Premiums are MONTHLY (annualized x12 by the Medicare agent).
    part_b_base_monthly_premium: 202.90  # vintage: 2026, source: CMS 2026 Part B fact sheet
    part_d_base_monthly_premium: 34.50   # vintage: 2026, source: CMS Part D national base premium
    # IRMAA tiers: applied when two-year-lookback MAGI EXCEEDS the filing-status lower bound.
    # vintage: 2026, source: CMS 2026 Parts B fact sheet (Part B monthly); SSA Part D IRMAA.
    irmaa_tiers:
      - {magi_min_single: 0,      magi_min_married_filing_jointly: 0,      part_b_monthly: 202.90, part_d_monthly_surcharge: 0.0}
      - {magi_min_single: 109000, magi_min_married_filing_jointly: 218000, part_b_monthly: 284.06, part_d_monthly_surcharge: 14.5}
      - {magi_min_single: 137000, magi_min_married_filing_jointly: 274000, part_b_monthly: 405.80, part_d_monthly_surcharge: 37.5}
      - {magi_min_single: 171000, magi_min_married_filing_jointly: 342000, part_b_monthly: 527.54, part_d_monthly_surcharge: 60.4}
      - {magi_min_single: 205000, magi_min_married_filing_jointly: 410000, part_b_monthly: 649.28, part_d_monthly_surcharge: 83.3}
      - {magi_min_single: 500000, magi_min_married_filing_jointly: 750000, part_b_monthly: 690.06, part_d_monthly_surcharge: 91.0}
  long_term_care:
    start_age: 65
    # Annual hazard of entering a care episode, by age band (max_age inclusive).
    # vintage: 2024, source: calibrated to ASPE lifetime-risk data -- TODO(verify) annual incidence
    hazard_bands:
      - {max_age: 74,  annual_hazard: 0.005}
      - {max_age: 84,  annual_hazard: 0.02}
      - {max_age: 200, annual_hazard: 0.06}
    annual_cost: 111325       # vintage: 2024, source: Genworth/CareScout (semi-private nursing home)
    mean_duration_years: 2.3  # vintage: 2024, source: ASPE mean paid nursing-home episode
  funeral_cost: 8300              # vintage: 2023, source: NFDA median funeral w/ viewing and burial
  final_year_medical_multiplier: 2.0  # vintage: 2024, source: elevated end-of-life spend -- TODO(verify)
  medical_deduction_agi_floor: 7.5    # percent; IRC §213(a) unreimbursed-medical AGI floor

