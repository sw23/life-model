# Default financial configuration values for life-model
#
# The top-level `tax` section holds the current-year (2026) snapshot used by the
# single-year tax path. The year-indexed `tax_years` table near the bottom of this
# file holds published values for 2022-2026 for the year-aware tax API
# (config.tax_year(year)); see docs/configuration.md for the projection rule.

tax:
  # vintage: 2026, source: IRS Rev. Proc. 2025-32 (tax year 2026, post-OBBBA)
  federal:
    standard_deduction:
      single: 16100
      married_filing_jointly: 32200
      head_of_household: 24150
    tax_brackets:
      single:
        - [0, 12400, 10]
        - [12401, 50400, 12]
        - [50401, 105700, 22]
        - [105701, 201775, 24]
        - [201776, 256225, 32]
        - [256226, 640600, 35]
        - [640601, .inf, 37]
      married_filing_jointly:
        - [0, 24800, 10]
        - [24801, 100800, 12]
        - [100801, 211400, 22]
        - [211401, 403550, 24]
        - [403551, 512450, 32]
        - [512451, 768700, 35]
        - [768701, .inf, 37]
      head_of_household:
        - [0, 17700, 10]
        - [17701, 67450, 12]
        - [67451, 105700, 22]
        - [105701, 201750, 24]  # Rev. Proc. 2025-32 §4.01 Table 2 (single's row ends at 201,775)
        - [201751, 256200, 32]
        - [256201, 640600, 35]
        - [640601, .inf, 37]
    # Preferential rates for long-term capital gains and qualified dividends. Same
    # [lower, upper, rate] shape as the ordinary brackets; the gain is stacked on top of ordinary
    # income, so ordinary income fills the 0%/15% bands first.
    # vintage: 2026, source: IRS Rev. Proc. 2025-32 §3.03
    capital_gains:
      single:
        - [0, 49450, 0]
        - [49451, 545500, 15]
        - [545501, .inf, 20]
      married_filing_jointly:
        - [0, 98900, 0]
        - [98901, 613700, 15]
        - [613701, .inf, 20]
      head_of_household:
        - [0, 66200, 0]
        - [66201, 579600, 15]
        - [579601, .inf, 20]
      married_filing_separately:
        - [0, 49450, 0]
        - [49451, 306850, 15]
        - [306851, .inf, 20]
    # Net investment income surtax. Thresholds are statutory and have never been indexed, so they
    # are deliberately excluded from the tax_years projection path below.
    # vintage: statutory, source: IRC §1411 (not inflation-indexed)
    niit:
      rate: 3.8  # percentage
      single: 200000
      married_filing_jointly: 250000
      head_of_household: 200000
    # vintage: statutory, source: IRC §1211(b) / IRS Topic 409 (not inflation-indexed since 1978)
    capital_loss_ordinary_offset: 3000
    # vintage: 2026, source: IRC §163(h)(3) (TCJA acquisition-debt limit)
    mortgage_interest_debt_limit: 750000
    # Debt incurred on or before 2017-12-15 keeps the $1,000,000 limit (and reduces the $750,000 limit of
    # later debt); home-equity debt not used to buy, build or substantially improve the home is not
    # deductible for years after 2017. The engine compares origination months, so a loan originated in
    # December 2017 counts as grandfathered (the statute's day is the 15th).
    # vintage: statutory, source: IRC §163(h)(3)(B)(ii), (F)(i)(I) and (IV) as amended by P.L. 115-97 and
    # P.L. 119-21 (law.cornell.edu/uscode/text/26/163, fetched 2026-10-18)
    mortgage_interest_grandfathered_debt_limit: 1000000
    mortgage_interest_grandfather_date: "2017-12"
    # SALT cap: static mirror of tax_years[2026].salt (simulated years read the year table; after it,
    # salt_cap_statute's schedule applies). vintage: 2026, source: OBBBA (P.L. 119-21) §70120, IRC
    # §164(b)(7): $40,400 cap, reduced by 30% of MAGI over $505,000, not below $10,000 (MFS: half).
    salt_deduction_cap: 40400
    salt_phaseout_threshold: 505000
    salt_phaseout_rate: 30.0
    salt_cap_floor: 10000
    # vintage: statutory, source: OBBBA §70120 (IRC §164(b)(7)(A)): cap and threshold grow 1% a year
    # through 2029, then the cap reverts to $10,000 with no phase-down. The statute states no rounding
    # for the 1% steps — TODO(verify) against IRS guidance once 2027 is published.
    salt_cap_statute:
      annual_increase_percent: 1.0
      increase_through_year: 2029
      reversion_year: 2030
      reversion_cap: 10000
    # vintage: statutory, source: OBBBA §70103 (IRC §151(d)(5)(C)), tax years 2025-2028
    senior_deduction:
      amount: 6000
      age: 65
      first_year: 2025
      last_year: 2028
      phaseout_rate: 6.0
      phaseout_start_single: 75000
      phaseout_start_married_filing_jointly: 150000
    # vintage: statutory, source: IRC §170(b)(1)(G) (60% cash limit, permanent under OBBBA),
    # §170(d)(1) five-year carryover
    charitable:
      cash_agi_limit_percent: 60.0
      carryforward_years: 5
      # vintage: statutory, source: IRC §170(b)(1)(C)(i) (30% of AGI for long-term capital gain property)
      property_agi_limit_percent: 30.0
      # vintage: statutory, source: OBBBA (P.L. 119-21) §70424, IRC §170(p) ($1,000 / $2,000 joint, from 2026)
      non_itemizer_first_year: 2026
      non_itemizer_limit_single: 1000
      non_itemizer_limit_joint: 2000
      # vintage: statutory, source: OBBBA §70425, IRC §170(b)(1)(I) (0.5% of the contribution base, from 2026)
      floor_first_year: 2026
      floor_percent: 0.5
      # vintage: statutory, source: OBBBA §70111, IRC §68 (2/37 limitation on itemized deductions, from 2026)
      itemized_limit_first_year: 2026
    # Credit switches (statutory). The education credits (IRC §25A: AOTC 100% of $2,000 + 25% of $2,000, 40%
    # refundable, four years; LLC 20% of $10,000; both phased out over $80,000-$90,000 / $160,000-$180,000 of
    # MAGI, not indexed since P.L. 116-260 §104) take the statutory defaults of config/models.py.
    # vintage: statutory, source: IRC §25A(b), (c), (d), (i); SECURE 2.0 §103 (saver's credit through 2026)
    credits:
      education: {}
    # Estimated tax and the underpayment penalty. vintage: statutory, source: IRC §6654(d)(1)
    # (required annual payment: 90% of this year's tax or 100% of last year's, 110% when last year's AGI was
    # over $150,000 / $75,000 separate), §6654(e)(1) ($1,000), Instructions for Form 2210 (2024, 2025).
    estimated_tax:
      required_current_pct: 90
      required_prior_pct: 100
      required_prior_high_income_pct: 110
      high_income_agi: 150000
      minimum_balance_due: 1000
      # vintage: 2026, source: IRS individual underpayment rates (IRC §6621(a)(2)): IR-2023-219, IR-2024-47,
      # IR-2024-138, IR-2024-220 (2024: 8%); IR-2024-290, IR-2025-29, IR-2025-59, IR-2025-87 (2025: 7%);
      # IR-2025-112, Rev. Rul. 2026-5, Rev. Rul. 2026-10, IR-2026-98 (2026). Later quarters reuse the latest
      # rate. TODO(verify): the 2027Q1 rate (it reaches a 2026 penalty) is not announced yet.
      underpayment_rates: {"2024Q1": 8, "2024Q2": 8, "2024Q3": 8, "2024Q4": 8, "2025Q1": 7, "2025Q2": 7,
                           "2025Q3": 7, "2025Q4": 7, "2026Q1": 7, "2026Q2": 6, "2026Q3": 7, "2026Q4": 7}
    # vintage: 2026, source: IRC §2010 unified credit (post-OBBBA ~$15M); §2001(c) top estate-tax rate 40%
    estate_tax_exemption: 15000000
    estate_tax_rate: 40.0  # percentage
  state:
    # Flat rate that is the authoritative source for the DEFAULT pack: the config synthesizes
    # packs.DEFAULT from it, so a config or scenario that sets only tax.state.tax_rate loads as a
    # single flat-rate pack.
    tax_rate: 6.0  # percentage
    # Residents with no explicit Person(state=...) fall back to this pack. DEFAULT applies the flat
    # tax_rate to the federal AGI base.
    default_state: DEFAULT
    # Per-state tax packs. Each pack has exactly one of flat_rate or brackets
    # ([lower, upper, rate] rows per filing status; missing statuses fall back to single), an
    # optional state standard deduction (default 0), and the two base flags:
    #   retirement_income_taxable — pre-tax 401k/IRA distributions and RMDs (default true)
    #   ss_taxable — the federally taxable portion of Social Security benefits (default false;
    #                most states exempt SS entirely)
    # Local/city income taxes (e.g. NYC), state EITCs, and state-specific credits are out of
    # scope. Refresh these packs annually against each state DOR (see refresh-financial-data).
    packs:
      # California (per tax year, with head of household and exemption credits). The 1% Mental Health Services Tax
      # (R&TC §17043) on taxable income over $1,000,000 (not doubled for joint returns) is folded into the top rows.
      # The exemption credits ($6 less for each $2,500 of AGI over the threshold, $1,250 separate) are modeled;
      # blind credits are not. A separate return uses the single schedule.
      CA:
        years:
          # vintage: 2025, source: FTB 2025 California Tax Rate Schedules (X, Y, Z) and 2025 Form 540 Booklet (standard
          # deduction chart; exemption credits lines 7-10; AGI limitation worksheet, line 32).
          2025:
            brackets:
              single: [[0, 11079, 1.0], [11080, 26264, 2.0], [26265, 41452, 4.0], [41453, 57542, 6.0], [57543, 72724, 8.0], [72725, 371479, 9.3], [371480, 445771, 10.3], [445772, 742953, 11.3], [742954, 1000000, 12.3], [1000001, .inf, 13.3]]
              married_filing_jointly: [[0, 22158, 1.0], [22159, 52528, 2.0], [52529, 82904, 4.0], [82905, 115084, 6.0], [115085, 145448, 8.0], [145449, 742958, 9.3], [742959, 891542, 10.3], [891543, 1000000, 11.3], [1000001, 1485906, 12.3], [1485907, .inf, 13.3]]
              head_of_household: [[0, 22173, 1.0], [22174, 52530, 2.0], [52531, 67716, 4.0], [67717, 83805, 6.0], [83806, 98990, 8.0], [98991, 505208, 9.3], [505209, 606251, 10.3], [606252, 1000000, 11.3], [1000001, 1010417, 12.3], [1010418, .inf, 13.3]]
            standard_deduction: {single: 5706, married_filing_jointly: 11412, head_of_household: 11412, married_filing_separately: 5706}
            personal_credit: 153
            senior_credit: 153
            dependent_credit: 475
            credit_phaseout:
              start: {single: 252203, married_filing_jointly: 504411, head_of_household: 378310, married_filing_separately: 252203}
              step: 2500
              per_step: 6
              step_separate: 1250
            # CA taxes retirement distributions in full and exempts Social Security.
            retirement_income_taxable: true
            ss_taxable: false
          # vintage: 2026, source: FTB Tax News, October 2026 ("2026 Indexing": rate schedules, standard deduction, exemption
          # credits). TODO(verify): the 2026 credit phase-out thresholds (not published yet; the 2025 ones kept).
          2026:
            brackets:
              single: [[0, 11456, 1.0], [11457, 27157, 2.0], [27158, 42861, 4.0], [42862, 59498, 6.0], [59499, 75197, 8.0], [75198, 384109, 9.3], [384110, 460927, 10.3], [460928, 768213, 11.3], [768214, 1000000, 12.3], [1000001, .inf, 13.3]]
              married_filing_jointly: [[0, 22912, 1.0], [22913, 54314, 2.0], [54315, 85722, 4.0], [85723, 118996, 6.0], [118997, 150394, 8.0], [150395, 768218, 9.3], [768219, 921854, 10.3], [921855, 1000000, 11.3], [1000001, 1536426, 12.3], [1536427, .inf, 13.3]]
              head_of_household: [[0, 22927, 1.0], [22928, 54316, 2.0], [54317, 70018, 4.0], [70019, 86654, 6.0], [86655, 102356, 8.0], [102357, 522385, 9.3], [522386, 626864, 10.3], [626865, 1000000, 11.3], [1000001, 1044771, 12.3], [1044772, .inf, 13.3]]
            standard_deduction: {single: 5900, married_filing_jointly: 11800, head_of_household: 11800, married_filing_separately: 5900}
            personal_credit: 158
            senior_credit: 158
            dependent_credit: 491
            credit_phaseout:
              start: {single: 252203, married_filing_jointly: 504411, head_of_household: 378310, married_filing_separately: 252203}
              step: 2500
              per_step: 6
              step_separate: 1250
            retirement_income_taxable: true
            ss_taxable: false
      # New York (per tax year, with head of household and the $1,000 dependent exemption). Not modeled: the
      # supplemental "tax benefit recapture" over $107,650 of NY AGI and the $20,000 pension / IRA exclusion at 59.5.
      # A separate return uses the single schedule.
      NY:
        years:
          # vintage: 2025, source: NYS DTF IT-201-I (2025) p.33 (tax rate schedules), p.11 (standard deductions), line 36
          # (dependent exemption)
          2025:
            brackets:
              single: [[0, 8500, 4.0], [8501, 11700, 4.5], [11701, 13900, 5.25], [13901, 80650, 5.5], [80651, 215400, 6.0], [215401, 1077550, 6.85], [1077551, 5000000, 9.65], [5000001, 25000000, 10.3], [25000001, .inf, 10.9]]
              married_filing_jointly: [[0, 17150, 4.0], [17151, 23600, 4.5], [23601, 27900, 5.25], [27901, 161550, 5.5], [161551, 323200, 6.0], [323201, 2155350, 6.85], [2155351, 5000000, 9.65], [5000001, 25000000, 10.3], [25000001, .inf, 10.9]]
              head_of_household: [[0, 12800, 4.0], [12801, 17650, 4.5], [17651, 20900, 5.25], [20901, 107650, 5.5], [107651, 269300, 6.0], [269301, 1616450, 6.85], [1616451, 5000000, 9.65], [5000001, 25000000, 10.3], [25000001, .inf, 10.9]]
            standard_deduction: {single: 8000, married_filing_jointly: 16050, head_of_household: 11200, married_filing_separately: 8000}
            dependent_exemption: 1000
            retirement_income_taxable: true
            ss_taxable: false
          # vintage: 2026, source: NYS DTF IT-2105-I (2026) p.10 (New York State tax rates, standard deductions)
          2026:
            brackets:
              single: [[0, 8500, 3.9], [8501, 11700, 4.4], [11701, 13900, 5.15], [13901, 80650, 5.4], [80651, 215400, 5.9], [215401, 1077550, 6.85], [1077551, 5000000, 9.65], [5000001, 25000000, 10.3], [25000001, .inf, 10.9]]
              married_filing_jointly: [[0, 17150, 3.9], [17151, 23600, 4.4], [23601, 27900, 5.15], [27901, 161550, 5.4], [161551, 323200, 5.9], [323201, 2155350, 6.85], [2155351, 5000000, 9.65], [5000001, 25000000, 10.3], [25000001, .inf, 10.9]]
              head_of_household: [[0, 12800, 3.9], [12801, 17650, 4.4], [17651, 20900, 5.15], [20901, 107650, 5.4], [107651, 269300, 5.9], [269301, 1616450, 6.85], [1616451, 5000000, 9.65], [5000001, 25000000, 10.3], [25000001, .inf, 10.9]]
            standard_deduction: {single: 8000, married_filing_jointly: 16050, head_of_household: 11200, married_filing_separately: 8000}
            dependent_exemption: 1000
            retirement_income_taxable: true
            ss_taxable: false
      # vintage: 2025, source: TX — no state individual income tax (Tex. Const. art. VIII §24-a).
      TX:
        flat_rate: 0.0
      # vintage: 2025, source: FL — no state individual income tax (Fla. Const. art. VII §5).
      FL:
        flat_rate: 0.0
      # vintage: 2025, source: WA — no state individual income tax on wages/retirement income.
      # Simplification: WA's 7% capital-gains excise (RCW 82.87) is not modeled.
      WA:
        flat_rate: 0.0
      # vintage: 2025, source: PA DOR — flat personal income tax 3.07% (72 P.S. §7302);
      # retirement-plan distributions after retirement and Social Security are not taxable
      # compensation (61 Pa. Code §101.6). No standard deduction.
      PA:
        flat_rate: 3.07
        retirement_income_taxable: false
        ss_taxable: false
      # vintage: 2025, source: IL DOR 2025 IL-1040 instructions — flat 4.95% (35 ILCS 5/201);
      # federally taxed retirement income and Social Security are subtracted (IL-1040 Line 5).
      # The exemption allowance ($2,850 single / $5,700 MFJ, 2025) is modeled as a standard
      # deduction; its AGI phase-out over $250k/$500k is not modeled.
      IL:
        flat_rate: 4.95
        retirement_income_taxable: false
        ss_taxable: false
        standard_deduction:
          single: 2850
          married_filing_jointly: 5700
      # vintage: 2025, source: MA DOR (mass.gov "Massachusetts 4% Surtax on Taxable Income") —
      # flat 5% plus 4% surtax on taxable income over $1,083,150 (2025, inflation-indexed),
      # modeled as two brackets. The personal exemption ($4,400 single / $8,800 MFJ) is modeled
      # as a standard deduction. The surtax threshold does not double for joint filers.
      MA:
        brackets:
          single:
            - [0, 1083150, 5.0]
            - [1083151, .inf, 9.0]  # 5% + 4% surtax
        standard_deduction:
          single: 4400
          married_filing_jointly: 8800
        retirement_income_taxable: true
        ss_taxable: false
      # ------------------------------------------------------------------------------------------
      # The ten next-largest states after those above (Census Bureau Vintage 2025 state population
      # estimates, NST-EST2025: OH, GA, NC, MI, NJ, VA, AZ, TN, IN, MO; MD is 11th, added as well), each per
      # tax year from the state's revenue department. State amounts are not inflation-projected past the last
      # year. Local / county income taxes (OH, MI, IN, MD) are not modeled.
      # ------------------------------------------------------------------------------------------
      OH:
        # One schedule for every filing status, with a jump at $26,050 (and, in 2025, at $100,000), so each row
        # carries the tax at its start. Exemptions by modified AGI band, per filer and dependent. Not modeled:
        # the $20 exemption credit (MAGI less exemptions under $30,000), the joint filing credit, the retirement
        # income and senior credits (at most $200 / $50 a return).
        years:
          # vintage: 2025, source: Ohio Department of Taxation 2025 IT 1040 Instructions pp.17-18; ORC 5747.02(A)(3)(b),
          # 5747.025 (HB 96, effective 2025-09-30)
          2025:
            brackets:
              single: [[0, 26050, 0.0], [26051, 100000, 2.75], [100001, .inf, 3.125]]
            bracket_base_tax: [0.0, 342.0, 2394.32]
            exemption_by_agi:
              single: [[40000, 2400], [80000, 2150], [749999.99, 1900], [.inf, 0]]
            ss_taxable: false
          # vintage: 2026, source: ORC 5747.02(A)(3)(c) and 5747.025 (HB 96); Ohio LSC HB 96 Final Analysis (2025-11-25;
          # exemption indexing suspended for 2025-2026). TODO(verify): the 2026 IT 1040 booklet is not published yet.
          2026:
            brackets:
              single: [[0, 26050, 0.0], [26051, .inf, 2.75]]
            bracket_base_tax: [0.0, 332.0]
            exemption_by_agi:
              single: [[40000, 2400], [80000, 2150], [499999.99, 1900], [.inf, 0]]
            ss_taxable: false
      GA:
        # The retirement exclusion also covers interest, dividends, capital gains, rents and $5,000 of earned income;
        # modeled on pre-tax distributions and pensions only.
        years:
          # vintage: 2025, source: Georgia DOR 2025 IT-511 Individual Income Tax Instruction Booklet pp.9, 16-17, 21-22, 48
          2025:
            flat_rate: 5.19
            standard_deduction: {single: 12000, married_filing_jointly: 24000, head_of_household: 12000, married_filing_separately: 12000}
            dependent_exemption: 4000
            retirement_exclusion:
              - {amount: 35000, min_age: 62, max_age: 64}
              - {amount: 65000, min_age: 65}
          # vintage: 2026, source: Georgia HB 463 (2026, signed 2026-05-11) amending O.C.G.A. 48-7-20, -26, -27; Georgia DOR
          # Employer's Tax Guide 2026
          2026:
            flat_rate: 4.99
            standard_deduction: {single: 15000, married_filing_jointly: 30000, head_of_household: 15000, married_filing_separately: 15000}
            dependent_exemption: 5000
            retirement_exclusion:
              - {amount: 35000, min_age: 62, max_age: 64}
              - {amount: 65000, min_age: 65}
      NC:
        # Retirement income is taxable (the Bailey-settlement and military exclusions are not modeled); the child
        # deduction is per child under 17, by federal AGI.
        years:
          # vintage: 2025, source: NCDOR 2025 D-401 Individual Income Tax Instructions pp.7, 13-14, 18; G.S. 105-153.5(a)(1),
          # 105-153.7(a)
          2025:
            flat_rate: 4.25
            standard_deduction: {single: 12750, married_filing_jointly: 25500, head_of_household: 19125, married_filing_separately: 12750}
            child_deduction: &nc_child
              married_filing_jointly: [[0, 40000, 3000], [40000.01, 60000, 2500], [60000.01, 80000, 2000], [80000.01, 100000, 1500], [100000.01, 120000, 1000], [120000.01, 140000, 500], [140000.01, .inf, 0]]
              head_of_household: [[0, 30000, 3000], [30000.01, 45000, 2500], [45000.01, 60000, 2000], [60000.01, 75000, 1500], [75000.01, 90000, 1000], [90000.01, 105000, 500], [105000.01, .inf, 0]]
              single: [[0, 20000, 3000], [20000.01, 30000, 2500], [30000.01, 40000, 2000], [40000.01, 50000, 1500], [50000.01, 60000, 1000], [60000.01, 70000, 500], [70000.01, .inf, 0]]
          # vintage: 2026, source: NCDOR Tax Rate Schedules page and 2026 NC-30 withholding tables; S.L. 2026-41 §44.1 (3.99%
          # for 2026); G.S. 105-153.5. TODO(verify): the 2026 child deduction table (assumed unchanged).
          2026:
            flat_rate: 3.99
            standard_deduction: {single: 12750, married_filing_jointly: 25500, head_of_household: 19125, married_filing_separately: 12750}
            child_deduction: *nc_child
      MI:
        # The retirement subtraction is per return, by the older filer's birth year (2025: born 1946-1966 up to
        # $49,423 / $98,846; born before 1946 $65,897 / $131,794 of private pensions, public pensions in full,
        # modeled at the private limits); from 2026 no birth-year cutoff.
        years:
          # vintage: 2025, source: Michigan Department of Treasury 2025 MI-1040 Instructions pp.3, 10-11, 14, 17, 19-22
          2025:
            flat_rate: 4.25
            personal_exemption: 5800
            dependent_exemption: 5800
            retirement_exclusion:
              - {amount_by_status: {single: 65897, married_filing_jointly: 131794}, born_through: 1945, per_return: true}
              - {amount_by_status: {single: 49423, married_filing_jointly: 98846}, born_from: 1946, born_through: 1966, per_return: true}
          # vintage: 2026, source: Michigan Department of Treasury Form 446 (Rev. 02-26), 2026 Michigan Income Tax Withholding
          # Guide; MCL 206.30(1)(f) (the phase-in is complete)
          2026:
            flat_rate: 4.25
            personal_exemption: 5900
            dependent_exemption: 5900
            retirement_exclusion:
              - {amount_by_status: {single: 67610, married_filing_jointly: 135220}, per_return: true}
      NJ:
        # Two schedules (single / separate; joint / head of household). The pension exclusion is per return for a
        # filer 62 or older, capped by status while total income is at most $100,000; the 100-150k percentage tiers
        # are not modeled (the full cap applies to $150,000, nothing above).
        years:
          # vintage: 2025, source: NJ Division of Taxation 2025 NJ-1040 instructions p.63 (rate schedules), pp.6-7
          # (exemptions), p.20 (pension exclusion)
