relationships:
  marriages:
  - spouses:
    - john
    - jane
events:
- id: jane_promotion
  at:
    year: 2027
  person: jane
  name: Jane is promoted
  action: change_job
  job: jane_job
  salary_annual: 72000
- id: john_car
  at:
    age: 55
  person: john
  name: John buys a new car for $32k
  action: one_time_expense
  amount: 32000
- id: junior_college
  at:
    year: 2033
  person: john
  name: Junior's college room and board
  action: recurring_expense
  amount_annual: 15000
  until:
    year: 2036
- id: invest_bonus
  at:
    relative:
      after: jane_promotion
      years: 1
  person: jane
  name: Jane invests a bonus
  action: contribute
  account: jane_brokerage
  amount: 10000
- id: downsize_spending
  at:
    relative:
      after: john_car
      years: 5
  person: john
  name: Spending falls once John retires
  action: change_spending
  change_pct: -15
