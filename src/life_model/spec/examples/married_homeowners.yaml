# Synthetic example household (not real data): the John and Jane family from ExampleSimulation.ipynb,
# married homeowners with a child. Load it with life_model.spec.load_example("married_homeowners").
spec_version: 1
meta:
  name: Married homeowners
  description: Synthetic example. Two married earners, a mortgaged home, a 529 for their son, life
    insurance and five dated events.
  as_of: 2026-01
  start_year: 2026
  end_year: 2072
  # The flat DEFAULT state rate, chosen explicitly (Plan 31 D4: no silent fallback).
  default_state: DEFAULT
people:
- id: john
  name: John
  age: 44
  birth: '1981-06'
  gender: male
  retirement_age: 60
  spending:
    amount_annual: 12000
    growth_pct: 5
  jobs:
  - id: john_job
    company: Pizza Papa
    role: Manager
    salary_annual: 50000
    raise_pct: 1
    bonus_pct: 1
    payroll:
      health_premium_monthly: 250
  accounts:
  - kind: bank
    company: Bank
    balance: 20000
    interest_pct: 0.5
  - kind: 401k
    job: john_job
    pretax_balance: 100000
    roth_balance: 100000
    pretax_contrib_pct: 15
    roth_contrib_pct: 5
    growth_pct: 5
    match_tiers:
    - match_pct: 50
      up_to_pay_pct: 6
  - kind: 529
    beneficiary: junior
    balance: 18000
  housing:
  - kind: home
    name: John and Jane's House
    purchase_price: 350000
    value_growth_pct: 5
    down_payment: 75000
    mortgage:
      original_amount: 275000
      balance: 233873
      rate_pct: 3.5
      term_years: 30
      start_year: 2019
    expenses:
      property_tax_pct: 0.88
      insurance_pct: 0.5
