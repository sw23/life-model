# Synthetic example household (not real data): a self-employed consultant. The business is a sole
# proprietorship (Schedule C): its net profit is taxed with self-employment tax (Schedule SE), half of
# which is deducted, a SEP-IRA contribution at a 15% plan rate goes to the traditional IRA, and the
# qualified business income deduction applies. The example makes no estimated payments: the year's tax
# is settled at year end.
