# Household golden (synthetic, not real data). See ../README.md.
spec_version: 1
meta:
  name: Early retiree harvesting gains
  description: 'Household golden (synthetic): a 58-year-old early retiree living on savings and brokerage
    sales, with gains taxed in the 0% and 15% brackets.'
  as_of: 2026-01
  start_year: 2026
  end_year: 2026
  seed: 1
  default_state: FL
people:
- id: sam
  name: Sam
  age: 58
  retirement_age: 50
  # The year's $80,000 of spending is paid in one December lump (event below), so the savings and the
  # brokerage are held all year and the year is paid by one sale, as the 1099s state.
  spending:
    amount_annual: 0
    growth_pct: 0
  accounts:
  - kind: bank
    id: sam_checking
    company: Community Bank
    type: Checking
    balance: 0
    interest_pct: 0.0
    compounding: annual
    primary: true
  - kind: bank
    id: sam_savings
    company: Credit Union
    type: Savings
    balance: 10000
    interest_pct: 4.0
    compounding: annual
  - kind: brokerage
    id: sam_brokerage
    company: Example Brokerage
    lots:
    - value: 900000
      cost_basis: 300000
      acquired_year: 2015
    growth_pct: 2
    # A fund that pays out its whole 2% total return (price flat over the year): with growth compounded
    # monthly and quarterly dividends on the start-of-month balance, that payout is
    # 4 x (1.02^(1/12) - 1.02^(-1/6)) = 1.9786...% a year, and the year's dividends are 2% of $900,000.
    dividend_yield_pct: 1.97863149058084
events:
- action: one_time_expense
  person: sam
  at: 2026-12
  amount: 80000
  name: the year's living spending
