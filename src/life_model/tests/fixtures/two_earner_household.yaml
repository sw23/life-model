    id: sam_car
    original_amount: 28000
    term_months: 60
    rate_pct: 6.9
    origination: '2024-02'
    balance: 19450                # above the 22-payment schedule: the loan is behind
    schedule: statement
  social_security:
    pia_override_monthly: 2050
    claim_age: 67
    fra_from_birth_year: true
    earnings_history: {2008: 31000, 2009: 33000, 2010: 35000, 2011: 38000, 2012: 41000, 2013: 44000,
      2014: 47000, 2015: 50000, 2016: 54000, 2017: 58000, 2018: 62000, 2019: 66000, 2020: 70000,
      2021: 75000, 2022: 80000, 2023: 85000, 2024: 90000, 2025: 93600}
relationships:
  marriages:
  - spouses: [dana, sam]
    year: 2015
    filing_status: joint
events:
- id: spending_drop
  name: Spending falls once both are retired
  at: {age: 60, person: sam}
  person: dana
  action: change_spending
  change_pct: -20
