name: Build distribution

# Reusable workflow: validate the release tag, build the sdist+wheel, verify
# metadata, smoke-install the wheel, and publish the artifact for downstream jobs.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to build the distribution.
        required: false
        default: '3.12'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build & validate distribution
    runs-on: ubuntu-latest
    steps:
    - name: Fail if not run from a version tag
      run: |
        if [[ "$GITHUB_REF" != refs/tags/* ]]; then
          echo "::error::This workflow must be dispatched from a version tag (refs/tags/vX.Y.Z), got '$GITHUB_REF'."
          exit 1
        fi
        if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid tag name format '$GITHUB_REF_NAME'. Expected 'vX.Y.Z'."
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0 # full history so setuptools-scm can derive the version from the tag
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install build tooling
      run: python -m pip install --upgrade pip build twine check-wheel-contents
    - name: Build a binary wheel and a source tarball
      run: python -m build
    - name: Validate metadata and wheel contents
      run: |
        twine check dist/*
        check-wheel-contents dist/*.whl
    - name: Smoke-install the wheel and run a simulation
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install dist/*.whl
        cd /tmp
        /tmp/smoke/bin/python -c "import life_model; print('imported', life_model.__version__)"
        # New subpackages must ship in the wheel (healthcare/Medicare/LTC).
        /tmp/smoke/bin/python -c "import life_model.healthcare; from life_model.healthcare import MedicalCosts, Medicare, LongTermCare; print('healthcare ok')"
        /tmp/smoke/bin/life-model run --example single_renter --years 5
        /tmp/smoke/bin/life-model explain --example married_homeowners --year 2035 > /dev/null
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/
