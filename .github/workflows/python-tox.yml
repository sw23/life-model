name: Python Tox

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0 # full history so setuptools-scm can derive the version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Run unit tests
      run: tox
    - name: Upload coverage
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: .coverage
        include-hidden-files: true

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - run: python -m pip install tox
    - run: tox -e lint

  type:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    # Lenient: mypy runs and reports but does not fail the pipeline; drop the
    # `|| ...` guard once the types are tightened.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - run: python -m pip install tox
    - name: Type check (non-blocking)
      run: tox -e type || echo "::warning::mypy reported errors (non-blocking)"

  notebooks:
    name: Notebook tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - run: python -m pip install tox
    - run: tox -e notebooks

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - run: python -m pip install tox
    - run: tox -e dashboard

  deepqlearning:
    name: RL tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - run: python -m pip install tox
    - run: tox -e deepqlearning

  deepqlearning-slow:
    name: RL training smoke (slow)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - run: python -m pip install tox
    - run: tox -e deepqlearning-slow

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build-and-smoke:
    name: Build & smoke-test wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0 # full history so setuptools-scm can derive the version
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Build distribution
      run: |
        python -m pip install --upgrade pip build twine check-wheel-contents
        python -m build
    - name: Validate metadata and wheel contents
      run: |
        twine check dist/*
        check-wheel-contents dist/*.whl
    - name: Install wheel into a clean environment and run a simulation
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install dist/*.whl
        # Run from a temp CWD to prove packaged data/config resolves without the repo.
        cd /tmp
        /tmp/smoke/bin/python -c "import life_model; print('imported', life_model.__version__)"
        # The console script from the wheel: the agent workflow end to end (copy, validate, run, explain).
        /tmp/smoke/bin/life-model --version
        /tmp/smoke/bin/life-model run --example single_renter --years 5
        mkdir -p /tmp/smoke-run && cd /tmp/smoke-run
        /tmp/smoke/bin/life-model examples --copy married_homeowners h.yaml
        /tmp/smoke/bin/life-model validate h.yaml
        /tmp/smoke/bin/life-model run h.yaml --out out --format json
        test -s out/result.json
        /tmp/smoke/bin/life-model explain h.yaml --year 2035
        /tmp/smoke/bin/python -m life_model --version
